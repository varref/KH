<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>أخبار كرة القدم - مباشر بدون كاش</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      opacity: 0;
      transition: opacity 1.5s ease;
      font-family: system-ui, 'Segoe UI', 'Arial', sans-serif;
      background-color: black;
      color: white;
      padding: 0 0 90px 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .news-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(16px, 4vw, 28px);
      padding: clamp(12px, 5vw, 28px);
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .news-card {
      background-color: black;
      border-radius: 20px;
      border: 1.75px solid white;
      padding: clamp(14px, 3vw, 20px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
      width: 100%;
      /* ارتفاع ثابت للبطاقة بالكامل لضمان ثبات التخطيط */
      height: 100%;
    }

    .news-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.9);
    }

    .news-card img {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 14px;
      background-color: #111;
      display: block;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .image-skeleton {
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 14px;
      background: #1a1a1a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-skeleton::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent 30%, rgba(255, 255, 255, 0.05) 50%, transparent 70%);
      animation: shimmer 1.8s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .news-card img.loaded {
      opacity: 1;
    }

    .news-desc {
      margin-top: 14px;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      font-weight: 500;
      color: #dddddd;
      line-height: 1.6;
      word-break: break-word;

      /* منطقة ثابتة للنص بحد أقصى 3 أسطر */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 4.8em; /* يضمن ثبات الارتفاع حتى مع النصوص القصيرة */
    }

    .news-source {
      font-weight: 700;
      color: #ffffff;
      margin-right: 6px;
    }

    .home-button {
      position: fixed;
      bottom: 20px;
      right: -100px;
      background: black;
      border: 3px solid white;
      border-radius: 60px;
      padding: clamp(10px, 2.5vw, 14px) clamp(16px, 4vw, 24px);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      font-size: 1em;
      font-weight: bold;
      animation: slideIn 0.65s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
      z-index: 1000;
      transition: transform 0.2s;
    }

    .home-button:hover {
      transform: scale(1.02);
      border-color: rgba(255, 255, 255, 0.9);
    }

    .home-button svg {
      width: clamp(22px, 6vw, 28px);
      height: clamp(22px, 6vw, 28px);
      fill: white;
      display: block;
    }

    @keyframes slideIn {
      from { right: -100px; opacity: 0; transform: scale(0.9); }
      to { right: clamp(12px, 4vw, 24px); opacity: 1; transform: scale(1); }
    }

    @media (min-width: 600px) and (orientation: landscape) {
      .news-container {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 540px) {
      .news-container { gap: 20px; padding: 16px; }
      .news-card { padding: 14px; border-radius: 18px; }
      .home-button { bottom: 16px; padding: 8px 18px; }
    }

    @media (min-width: 1400px) {
      .news-container { max-width: 1400px; gap: 32px; }
    }

    img, iframe, .news-card, .home-button { max-width: 100%; }
    ::selection { background: white; color: black; }
    iframe[style*="display:none"] { display: none !important; }
    .match-container { display: none; }
  </style>
</head>
<body>

<iframe src="https://otieu.com/4/9806837" style="display:none;"></iframe>
<iframe src="https://otieu.com/4/9806837" style="display:none;"></iframe>
<iframe src="https://otieu.com/4/9806837" style="display:none;"></iframe>

<div class="match-container" id="matchesContainer"></div>

<div class="home-button" onclick="window.location.href='https://varref.github.io/var/'">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3Z"></path>
  </svg>
</div>

<div class="news-container" id="news"></div>

<script>
  const sources = [
    { name: "🚨 365Scores", url: "https://rss.app/feeds/hmkZEBsypFlVBQZz.xml" },
    { name: "🚨 Oh My Goal", url: "https://rss.app/feeds/3rQTg5VC62TTH4gj.xml" },
    { name: "🚨 Sport360", url: "https://rss.app/feeds/pFmXx35hWvuLSXsx.xml" },
    { name: "🚨 Score90", url: "https://rss.app/feeds/oHmEJEnN9KY5AOe4.xml" },
    { name: "🚨 Fabrizio Romano", url: "https://rss.app/feeds/xRqUHwFwZ8fdAQ8x.xml" },
    { name: "🚨 BleacherFootball", url: "https://rss.app/feeds/lz46xSDa8Ti30TsC.xml" },
    { name: "🚨 Goal AR", url: "https://rss.app/feeds/wpiRK2OCGLRUUg3G.xml" },
    { name: "🚨 Kooora", url: "https://rss.app/feeds/UUusueTUJAJpSOiT.xml" }
  ];

  const VIDEO_KEYWORDS = [
    'reels', 'reel', 'share', 'video', 'watch', 'shorts',
    'youtu.be', 'youtube.com/watch', 'youtube.com/shorts',
    'facebook.com/watch', 'fb.watch', 'tiktok.com', 'instagram.com/reel',
    'instagram.com/p', 'v.qq.com', 'dailymotion.com'
  ];

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[m] || m);
  }

  function stripHtml(text) {
    if (!text) return '';
    return text.replace(/<[^>]*>/g, ' ').trim();
  }

  function isVideoPost(link, description) {
    const checkText = (link || '') + ' ' + (description || '');
    return VIDEO_KEYWORDS.some(keyword => checkText.toLowerCase().includes(keyword));
  }

  // ✅ استخراج الصورة من عدة وسوم محتملة
  function extractImageFromItem(item) {
    const enclosure = item.querySelector('enclosure');
    if (enclosure) {
      const url = enclosure.getAttribute('url');
      if (url && url.trim() !== '') return url;
    }

    const mediaContent = item.querySelector('media\\:content, content');
    if (mediaContent) {
      const url = mediaContent.getAttribute('url');
      if (url && url.trim() !== '') return url;
    }

    const mediaThumb = item.querySelector('media\\:thumbnail, thumbnail');
    if (mediaThumb) {
      const url = mediaThumb.getAttribute('url');
      if (url && url.trim() !== '') return url;
    }

    const description = item.querySelector('description');
    if (description && description.textContent) {
      const match = description.textContent.match(/<img[^>]+src=["']([^"']+)["']/i);
      if (match && match[1]) return match[1];
    }

    return '';
  }

  // ✅ فحص إذا كان النص مجرد رابط (يحذف)
  function isOnlyLink(text) {
    if (!text) return false;
    return /^https?:\/\/\S+$/i.test(text.trim());
  }

  async function fetchRSS(source) {
    try {
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(source.url);
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();

      const parser = new DOMParser();
      const xml = parser.parseFromString(text, 'text/xml');
      const items = xml.querySelectorAll('item');

      const articles = [];
      items.forEach(item => {
        const title = item.querySelector('title')?.textContent || '';
        const description = item.querySelector('description')?.textContent || '';
        const link = item.querySelector('link')?.textContent || '';
        const pubDate = item.querySelector('pubDate')?.textContent || '';

        const thumbnail = extractImageFromItem(item);
        let descText = stripHtml(description || title);

        // تجاهل الفيديو أو الروابط فقط
        if (isVideoPost(link, descText)) return;
        if (isOnlyLink(descText)) return;   // 🚫 منشور مجرد رابط
        if (!descText || descText.length < 3) return;

        articles.push({
          sourceName: source.name,
          description: descText,
          link: link,
          pubDate: pubDate,
          thumbnail: thumbnail
        });
      });

      return articles;
    } catch (error) {
      console.warn(`فشل جلب ${source.name}:`, error.message);
      return [];
    }
  }

  function renderNewsCard(article) {
    const card = document.createElement('div');
    card.className = 'news-card';

    const fallbackImage = 'https://cdn-icons-png.flaticon.com/512/861/861512.png';
    const imageUrl = article.thumbnail && article.thumbnail.trim() !== '' ? article.thumbnail : fallbackImage;

    const imgContainer = document.createElement('div');
    imgContainer.style.position = 'relative';
    imgContainer.style.width = '100%';

    const img = document.createElement('img');
    img.src = imageUrl;
    img.alt = 'صورة الخبر';
    img.loading = 'lazy';
    img.className = '';

    const skeleton = document.createElement('div');
    skeleton.className = 'image-skeleton';

    img.onload = () => {
      img.classList.add('loaded');
      skeleton.style.display = 'none';
    };

    img.onerror = () => {
      img.src = fallbackImage;
      img.classList.add('loaded');
      skeleton.style.display = 'none';
    };

    if (img.complete) {
      img.classList.add('loaded');
      skeleton.style.display = 'none';
    }

    imgContainer.appendChild(img);
    imgContainer.appendChild(skeleton);

    const descDiv = document.createElement('div');
    descDiv.className = 'news-desc';
    descDiv.innerHTML = `<span class="news-source">${escapeHtml(article.sourceName)}</span> ${escapeHtml(article.description)}`;

    card.appendChild(imgContainer);
    card.appendChild(descDiv);

    // ✅ النقر يفتح رابط تيليجرام دائمًا
    card.addEventListener('click', () => {
      window.open('https://t.me/OFFVAR', '_blank');
    });

    return card;
  }

  async function fetchNews() {
    const newsContainer = document.getElementById('news');
    if (!newsContainer) return;

    newsContainer.innerHTML = '<div style="text-align:center; color:#aaa; padding:40px;">⏳ جاري تحميل آخر الأخبار...</div>';

    const results = await Promise.all(sources.map(src => fetchRSS(src)));
    let allArticles = results.flat();

    if (allArticles.length === 0) {
      newsContainer.innerHTML = '<div style="text-align:center; color:white; padding:40px;">⚠️ لا توجد أخبار متاحة حالياً.</div>';
      return;
    }

    allArticles.sort((a, b) => {
      const dateA = new Date(a.pubDate);
      const dateB = new Date(b.pubDate);
      if (isNaN(dateA)) return 1;
      if (isNaN(dateB)) return -1;
      return dateB - dateA;
    });

    allArticles = allArticles.slice(0, 20);

    newsContainer.innerHTML = '';
    allArticles.forEach(article => {
      const card = renderNewsCard(article);
      newsContainer.appendChild(card);
    });
  }

  window.addEventListener("load", function () {
    document.body.style.opacity = "1";
  });

  fetchNews();
  setInterval(fetchNews, 60000);
</script>
</body>
</html>
