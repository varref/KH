<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>أخبار كرة القدم - RSS</title>
  
  <!-- خطوط داعمة للعربية من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      opacity: 0;
      transition: opacity 1.5s ease;
      font-family: 'Tajawal', 'Cairo', 'Arial', sans-serif;
      background-color: black;
      color: white;
      padding: 0 0 90px 0;
      min-height: 100vh;
      overflow-x: hidden;
      direction: rtl;
      text-align: right;
    }

    .news-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(16px, 4vw, 28px);
      padding: clamp(12px, 5vw, 28px);
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .news-card {
      background-color: black;
      border-radius: 20px;
      border: 1.75px solid white;
      padding: clamp(14px, 3vw, 20px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .news-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.9);
    }

    .news-card img {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 14px;
      background-color: #111;
      display: block;
      opacity: 0;
      transition: opacity 0.5s ease;
      position: relative;
      z-index: 2;
    }

    .image-skeleton {
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 14px;
      background: #1a1a1a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-skeleton::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent 30%, rgba(255, 255, 255, 0.05) 50%, transparent 70%);
      animation: shimmer 1.8s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .news-card img.loaded {
      opacity: 1;
    }

    .news-card img.loaded + .image-skeleton {
      display: none;
    }

    .news-desc {
      margin-top: 14px;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      font-weight: 500;
      color: #dddddd;
      line-height: 1.8;
      word-break: break-word;
    }

    .news-source {
      font-weight: 700;
      color: #ffffff;
      margin-left: 6px; /* لأن النص من اليمين لليسار */
    }

    .home-button {
      position: fixed;
      bottom: 20px;
      right: -100px;
      background: black;
      border: 3px solid white;
      border-radius: 60px;
      padding: clamp(10px, 2.5vw, 14px) clamp(16px, 4vw, 24px);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      font-size: 1em;
      font-weight: bold;
      animation: slideIn 0.65s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
      z-index: 1000;
      transition: transform 0.2s;
    }

    .home-button:hover {
      transform: scale(1.02);
      border-color: rgba(255, 255, 255, 0.9);
    }

    .home-button svg {
      width: clamp(22px, 6vw, 28px);
      height: clamp(22px, 6vw, 28px);
      fill: white;
      display: block;
    }

    @keyframes slideIn {
      from { right: -100px; opacity: 0; transform: scale(0.9); }
      to { right: clamp(12px, 4vw, 24px); opacity: 1; transform: scale(1); }
    }

    @media (min-width: 600px) and (orientation: landscape) {
      .news-container {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 540px) {
      .news-container { gap: 20px; padding: 16px; }
      .news-card { padding: 14px; border-radius: 18px; }
      .home-button { bottom: 16px; padding: 8px 18px; }
    }

    @media (min-width: 1400px) {
      .news-container { max-width: 1400px; gap: 32px; }
    }

    img, iframe, .news-card, .home-button { max-width: 100%; }
    ::selection { background: white; color: black; }
    iframe[style*="display:none"] { display: none !important; }
    .match-container { display: none; }
  </style>
</head>
<body>

<iframe src="https://otieu.com/4/9806837" style="display:none;"></iframe>
<iframe src="https://otieu.com/4/9806837" style="display:none;"></iframe>
<iframe src="https://otieu.com/4/9806837" style="display:none;"></iframe>

<div class="match-container" id="matchesContainer"></div>

<div class="home-button" onclick="window.location.href='https://varref.github.io/var/'">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3Z"></path>
  </svg>
</div>

<div class="news-container" id="news"></div>

<script>
  // ======================== مصدر RSS واحد ========================
  const SOURCE = {
    name: " ",
    url: "https://rss.app/feeds/7lqgiVP59RJDPPlt.xml"
  };

  const TELEGRAM_LINK = "https://t.me/OFFVAR";

  // كلمات لحظر الفيديوهات
  const VIDEO_KEYWORDS = [
    'reels', 'reel', 'share', 'video', 'watch', 'shorts',
    'youtu.be', 'youtube.com/watch', 'youtube.com/shorts',
    'facebook.com/watch', 'fb.watch', 'tiktok.com', 'instagram.com/reel',
    'instagram.com/p', 'v.qq.com', 'dailymotion.com'
  ];

  // ======================== دوال مساعدة ========================
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // تنظيف النصوص مع الحفاظ على العربية
  function cleanText(text) {
    if (!text) return '';
    // إزالة وسوم HTML
    let cleaned = text.replace(/<[^>]*>/g, ' ');
    // إزالة الروابط
    cleaned = cleaned.replace(/\bhttps?:\/\/[^\s]+/gi, '');
    // إزالة تكرار المسافات
    cleaned = cleaned.replace(/\s{2,}/g, ' ');
    return cleaned.trim();
  }

  function isVideoPost(link, description) {
    const checkText = (link || '') + ' ' + (description || '');
    return VIDEO_KEYWORDS.some(keyword => checkText.toLowerCase().includes(keyword));
  }

  // ======================== جلب RSS ========================
  async function fetchRSS() {
    try {
      const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(SOURCE.url)}`;
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (data.status !== 'ok') throw new Error('rss2json error');

      return data.items
        .map(item => ({
          sourceName: SOURCE.name,
          description: cleanText(item.description || item.title || ''),
          link: item.link || '',
          pubDate: item.pubDate || '',
          thumbnail: item.thumbnail || item.enclosure?.link || ''
        }))
        .filter(item => {
          if (isVideoPost(item.link, item.description)) return false;
          if (!item.description || item.description.length < 3) return false;
          return true;
        });
    } catch (error) {
      console.warn('فشل جلب الأخبار:', error.message);
      return [];
    }
  }

  // ======================== العرض الرئيسي ========================
  async function fetchNews() {
    const newsContainer = document.getElementById('news');
    if (!newsContainer) return;

    newsContainer.innerHTML = '<div style="text-align:center; color:#aaa; padding:40px;"> </div>';

    const articles = await fetchRSS();

    if (articles.length === 0) {
      newsContainer.innerHTML = '<div style="text-align:center; color:white; padding:40px;">⚠️ لا توجد أخبار حالياً، حاول مجدداً.</div>';
      return;
    }

    articles.sort((a, b) => {
      const dateA = new Date(a.pubDate);
      const dateB = new Date(b.pubDate);
      if (isNaN(dateA)) return 1;
      if (isNaN(dateB)) return -1;
      return dateB - dateA;
    });

    newsContainer.innerHTML = '';
    articles.forEach(article => {
      const card = document.createElement('div');
      card.className = 'news-card';

      const fallbackImage = 'https://cdn-icons-png.flaticon.com/512/861/861512.png';
      let imageUrl = article.thumbnail && article.thumbnail.trim() !== '' ? article.thumbnail : fallbackImage;

      card.innerHTML = `
        <div style="position: relative; width: 100%;">
          <img src="${imageUrl}" alt="صورة الخبر" loading="lazy" 
               onload="this.classList.add('loaded')" 
               onerror="this.onerror=null; this.src='${fallbackImage}'; this.classList.add('loaded');">
          <div class="image-skeleton" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
        </div>
        <div class="news-desc">
          <span class="news-source">${escapeHtml(article.sourceName)}</span>
          ${escapeHtml(article.description)}
        </div>
      `;

      const img = card.querySelector('img');
      const skeleton = card.querySelector('.image-skeleton');

      if (img.complete) img.classList.add('loaded');

      img.addEventListener('load', function() {
        this.classList.add('loaded');
        if (skeleton) skeleton.style.display = 'none';
      });

      img.addEventListener('error', function() {
        this.classList.add('loaded');
        if (skeleton) skeleton.style.display = 'none';
      });

      card.addEventListener('click', () => {
        window.open(TELEGRAM_LINK, '_blank');
      });

      newsContainer.appendChild(card);
    });
  }

  // ======================== التشغيل ========================
  window.addEventListener("load", function () {
    document.body.style.opacity = "1";
  });

  fetchNews();
  setInterval(fetchNews, 60000);
</script>
</body>
</html>
